<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preset Finder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #161618; --panel: #1e1e21; --line: #2b2b30; --text: #e6e6ea; --dim: #8d8d96;
      --chip: #26262b; --chip-line: #3a3a41; --accent: #f2c14e; --accent-ink: #1a1400;
      --hover: #25252a; --active: #2f3340; --ua: #8fb8ff; --third: #c9a2ff; --err: #ff8a80; --ok: #8fd694;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    header { padding: 10px 12px 8px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .bar { display: flex; gap: 8px; align-items: center; min-width: 0; }
    #q { flex: 1; min-width: 0; font-size: 15px; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--chip-line); background: #121214; outline: none; }
    #q:focus { border-color: var(--accent); }
    .btn { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 7px; padding: 6px 11px; white-space: nowrap; }
    .btn:hover { background: var(--hover); }
    .btn:disabled { opacity: .5; cursor: default; }

    #filters { flex-wrap: wrap; row-gap: 6px; }
    .seg { display: inline-flex; border: 1px solid var(--chip-line); border-radius: 7px; overflow: hidden; }
    .seg button { background: var(--chip); border: 0; padding: 4px 10px; font-size: 12px; border-right: 1px solid var(--chip-line); }
    .seg button:last-child { border-right: 0; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .toggle { font-size: 12px; padding: 4px 10px; }
    .toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    select { background: var(--chip); border: 1px solid var(--chip-line); border-radius: 7px; padding: 4px 6px; font-size: 12px; max-width: 170px; }
    select.set { border-color: var(--accent); }
    .chips { flex-wrap: wrap; gap: 5px; }
    .chips[hidden] { display: none; }
    .chip { font-size: 12px; padding: 3px 10px; border-radius: 13px; background: var(--chip); border: 1px solid var(--chip-line); white-space: nowrap; }
    .chip:hover { background: var(--hover); }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    .chip .c { opacity: .6; font-size: 11px; margin-left: 4px; }
    #comps { padding-left: 14px; border-left: 2px solid var(--accent); margin-left: 4px; }
    #comps .lbl { font-size: 11px; color: var(--dim); margin-right: 2px; }
    #clearFilters { font-size: 12px; padding: 4px 8px; background: none; border: 0; color: var(--dim); text-decoration: underline; }

    #target { font-size: 12px; color: var(--dim); justify-content: space-between; }
    #target { flex-wrap: wrap; row-gap: 4px; }
    .into { white-space: nowrap; }
    .into:has(select[hidden]) { display: none; }
    #into { max-width: 230px; }
    #where { flex: 1; min-width: 200px; }
    #target b { color: var(--text); font-weight: 600; }
    #status { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status.err { color: var(--err); }
    #status.ok { color: var(--ok); }
    #progress { height: 2px; background: var(--line); margin: 0 -12px -8px; }
    #progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    main:focus { outline: none; }
    main { flex: 1; overflow-y: auto; padding: 4px 0 16px; }
    .empty { color: var(--dim); padding: 28px 16px; text-align: center; line-height: 1.6; }
    .section { padding: 12px 12px 4px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
    .group > .gh { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 12px 4px; position: sticky; top: -4px; background: var(--bg); z-index: 1; }
    .gh .tw { width: 10px; color: var(--dim); font-size: 10px; }
    .gh .pn { font-weight: 600; }
    .gh .mk { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gh .n { margin-left: auto; color: var(--dim); font-size: 11px; }
    .tag { font-size: 10px; padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .85; flex: none; }
    .tag.ua { color: var(--ua); } .tag.third { color: var(--third); } .tag.inst { color: var(--accent); } .tag.user { color: var(--dim); }
    .group.closed .row { display: none; }

    .row { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 30px; cursor: pointer; min-width: 0; }
    .row:hover { background: var(--hover); }
    .row.active { background: var(--active); box-shadow: inset 2px 0 0 var(--accent); }
    .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .name mark { background: none; color: var(--accent); font-weight: 600; }
    .row .sub { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
    .star { background: none; border: 0; padding: 0 2px; color: #55555d; font-size: 14px; line-height: 1; flex: none; }
    .star.on { color: var(--accent); }
    .star:hover { color: var(--accent); }
    .more { margin: 10px 12px; }
    .busy { opacity: .55; pointer-events: none; }
    kbd { font: 11px Menlo, monospace; border: 1px solid var(--chip-line); border-radius: 4px; padding: 0 4px; }

    /* Narrow (browser pane): stack the target line, shorten chips. */
    @media (max-width: 460px) {
      #target { flex-direction: column; align-items: flex-start; gap: 2px; }
      #status { text-align: left; }
      .row .sub { display: none; }
    }
    /* Short (editor pane under the Timeline): tighter header. */
    @media (max-height: 300px) {
      header { padding: 6px 10px 6px; gap: 5px; }
      #q { font-size: 13px; padding: 4px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <input id="q" type="search" placeholder="Search every plugin's presets…" autocomplete="off" spellcheck="false" disabled>
      <button id="rescan" class="btn" title="Read every plugin's presets from LUNA again" disabled>Rescan</button>
    </div>
    <div class="bar chips" id="types" role="group" aria-label="Plugin type"></div>
    <div class="bar chips" id="comps" role="group" aria-label="Compressor kind" hidden></div>
    <div class="bar" id="filters">
      <div class="seg" id="source" role="group" aria-label="Plugin maker">
        <button data-v="all" aria-pressed="true">All</button><button data-v="ua">UA</button><button data-v="third">Third-party</button>
      </div>
      <div class="seg" id="kind" role="group" aria-label="Plugin type">
        <button data-v="all" aria-pressed="true">All</button><button data-v="effect">Effects</button><button data-v="instrument">Instruments</button>
      </div>
      <button id="fav" class="btn toggle" aria-pressed="false">★ Favourites</button>
      <select id="maker" aria-label="Maker"><option value="">Any maker</option></select>
      <select id="category" aria-label="Category"><option value="">Any category</option></select>
      <button id="clearFilters" hidden>Clear filters</button>
    </div>
    <div class="bar" id="target">
      <span class="into"><label for="into">Load into</label> <select id="into" hidden title="Auto swaps the slot you last loaded into, so you can click through presets and plugins in place. Pick a slot to replace what is in it."></select></span>
      <span id="where">Connecting to LUNA…</span>
      <span id="status"></span>
    </div>
    <div id="progress"><div></div></div>
  </header>
  <main id="results" tabindex="-1"></main>
  <script src="vendor/luna.global.js"></script>
  <!-- The bundle npm run build writes from src/: one classic script, never a module script. -->
  <script src="dist/main.js"></script>
</body>
</html>
